<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videos Educativos y Predicas | PRFWB</title>
    <meta name="description" content="Biblioteca de videos educativos y predicas para discipulado PRFWB." />
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --azul: #078ca3;
        --azul-oscuro: #12384d;
        --dorado: #f1c84b;
        --coral: #d95643;
        --fondo: #f4f8fa;
        --borde: #dbe7ec;
        color: #12384d;
        background: var(--fondo);
        line-height: 1.5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; overflow-x: hidden; background: var(--fondo); }
      .page-shell { width: 100%; margin: 0; padding: 0 0 64px; }
      .site-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 0.7rem max(1rem, calc((100vw - 1180px) / 2));
        border-bottom: 1px solid #dbe7ec;
        background: #ffffff;
      }
      .nav-logo img { width: 118px; height: 44px; object-fit: contain; display: block; }
      .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
      .nav-links a {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 15px;
        border-radius: 999px;
        color: #12384d;
        text-decoration: none;
        font-size: 14px;
        font-weight: 900;
      }
      .nav-links a.active { background: #12384d; color: white; }
      .nav-links a.donate-link {
        background: #f1c84b;
        color: #12384d;
        border: 1px solid rgba(18, 56, 77, .12);
      }
      .hero {
        color: white;
        padding: 62px max(1rem, calc((100vw - 1180px) / 2));
        background:
          radial-gradient(circle at 80% 28%, rgba(241, 200, 75, .32), transparent 26%),
          linear-gradient(125deg, #078fa4 0%, #08778e 42%, #123f60 74%, #102f49 100%);
      }
      .eyebrow {
        display: block;
        margin-bottom: 0.7rem;
        text-transform: uppercase;
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 0.22em;
        color: #f1c84b;
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.05; }
      .hero p { max-width: 740px; margin: 0; color: #f8fbfb; font-size: 1.08rem; }
      .content {
        width: min(1180px, calc(100% - 2rem));
        margin: -28px auto 0;
        position: relative;
        z-index: 2;
      }
      .video-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-bottom: 1rem;
      }
      .video-tabs button {
        min-height: 42px;
        border: 1px solid #dbe7ec;
        border-radius: 999px;
        padding: 0.65rem 0.95rem;
        background: white;
        color: #12384d;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
      }
      .video-tabs button.active { background: #12384d; color: white; border-color: #12384d; }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }
      .video-card {
        display: grid;
        overflow: hidden;
        min-height: 100%;
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: white;
        box-shadow: 0 12px 30px rgba(18, 61, 79, 0.08);
      }
      .video-thumb {
        display: grid;
        min-height: 160px;
        place-items: center;
        padding: 1rem;
        color: white;
        background:
          linear-gradient(rgba(18, 56, 77, .18), rgba(18, 56, 77, .46)),
          linear-gradient(135deg, #078ca3, #12384d);
      }
      .video-thumb.predica { background: linear-gradient(135deg, #21473f, #12384d); }
      .play-icon {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 999px;
        background: #f1c84b;
        color: #12384d;
        font-size: 1.5rem;
        font-weight: 900;
        box-shadow: 0 12px 28px rgba(0, 0, 0, .18);
      }
      .video-body { display: grid; gap: 0.55rem; padding: 1rem; }
      .video-body strong { font-size: 1.08rem; line-height: 1.25; }
      .video-body p { margin: 0; color: #4d5f66; }
      .tag {
        width: fit-content;
        border-radius: 999px;
        padding: 0.25rem 0.55rem;
        background: #fff6d6;
        color: #12384d;
        font-size: 0.78rem;
        font-weight: 900;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        min-height: 42px;
        margin-top: 0.25rem;
        padding: 0.7rem 0.95rem;
        border-radius: 8px;
        background: #12384d;
        color: white;
        font-weight: 900;
        text-decoration: none;
      }
      .note {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #dbe7ec;
        border-radius: 8px;
        background: #ffffff;
        color: #4d5f66;
      }
      .empty-state {
        padding: 1rem;
        background: #ffffff;
        border: 1px solid #dbe7ec;
        border-radius: 8px;
        color: #4d5f66;
        grid-column: 1 / -1;
      }
      @media (max-width: 850px) {
        .site-nav { align-items: flex-start; flex-direction: column; }
        .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 560px) {
        .site-nav { padding: 0.75rem 1rem; }
        .nav-links { width: 100%; display: grid; grid-template-columns: 1fr; }
        .nav-links a { border: 1px solid #dbe7ec; }
        .hero { padding: 42px 18px 56px; }
        .content { width: calc(100% - 2rem); margin-top: -20px; }
        .video-grid { grid-template-columns: 1fr; }
        .button, .video-tabs button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <nav class="site-nav" aria-label="Navegacion principal">
        <a class="nav-logo" href="./index.html?v=videos1">
          <img src="./prfwb-logo-main-cropped.png" alt="PRFWB" />
        </a>
        <div class="nav-links">
          <a href="./index.html?v=videos1">Inicio</a>
          <a href="./eventos.html?v=videos1">Eventos</a>
          <a class="active" href="./recursos.html?v=videos1">Recursos</a>
          <a href="./oracion.html?v=videos1">Oracion</a>
          <a class="donate-link" href="https://donate.stripe.com/7sY6oJ7XVcLz5WI5Ie63K00" target="_blank" rel="noopener">Donar PRFWB</a>
          <a href="./crece.html?v=videos1">CRECE</a>
        </div>
      </nav>

      <header class="hero">
        <span class="eyebrow">Biblioteca audiovisual</span>
        <h1>Videos educativos y predicas</h1>
        <p>Un espacio para reunir enseñanzas, estudios y mensajes que ayuden a formar discipulos y fortalecer la iglesia.</p>
        <a class="button" href="./recursos.html?v=videos1" style="margin-top: 1rem; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.32);">← Volver a Recursos</a>
      </header>

      <main class="content">
        <div id="videoTabs" class="video-tabs" aria-label="Filtros de videos"></div>

        <section id="videoGrid" class="video-grid"></section>
      </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./firebase-bridge.js?v=prayerfix1"></script>
    <script>
      let videos = [];
      let activeCategory = '';
      const grid = document.getElementById('videoGrid');
      const tabs = document.getElementById('videoTabs');

      function renderTabs() {
        const categories = [...new Set(videos.map((video) => video.category).filter(Boolean))];
        tabs.innerHTML = ['', ...categories].map((category) => `
          <button type="button" class="${activeCategory === category ? 'active' : ''}" data-video-filter="${category}">${category || 'Todos'}</button>
        `).join('');
      }

      function getThumbStyle(video) {
        if (!video.imageUrl) return '';
        return `style="background-image: linear-gradient(rgba(18,56,77,.25), rgba(18,56,77,.55)), url('${video.imageUrl}'); background-size: cover; background-position: center;"`;
      }

      function renderVideos() {
        const visible = activeCategory ? videos.filter((video) => video.category === activeCategory) : videos;
        grid.innerHTML = visible.length ? visible.map((video) => `
          <article class="video-card">
            <div class="video-thumb" ${getThumbStyle(video)}></div>
            <div class="video-body">
              ${video.category ? `<span class="tag">${video.category}</span>` : ''}
              <strong>${video.title}</strong>
              <p>${video.description || ''}</p>
              <a class="button" href="${video.externalUrl}" target="_blank" rel="noopener">Ver playlist</a>
            </div>
          </article>
        `).join('') : '<div class="empty-state">Todavía no hay videos publicados en esta categoría.</div>';
      }

      async function loadVideos() {
        const resources = await window.discipladoFirebase?.getResources?.() || [];
        videos = resources
          .filter((resource) => resource.type === 'video' && resource.isPublished)
          .sort((a, b) => Number(b.displayOrder || 0) - Number(a.displayOrder || 0));
        renderTabs();
        renderVideos();
      }

      tabs.addEventListener('click', (event) => {
        const button = event.target.closest('[data-video-filter]');
        if (!button) return;
        activeCategory = button.getAttribute('data-video-filter');
        renderTabs();
        renderVideos();
      });

      loadVideos();
    </script>
  <script src="js/wix-embed-resize.js"></script>
</body>
</html>
