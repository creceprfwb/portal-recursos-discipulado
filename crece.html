<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRECE | PRFWB</title>
    <style>
      :root {
        --azul: #078ca3;
        --azul-oscuro: #12384d;
        --dorado: #f1c84b;
        --blanco: #ffffff;
        --fondo: #f4f8fa;
        --texto: #526875;
        --borde: #dbe7ec;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        min-width: 320px;
        margin: 0;
        overflow-x: hidden;
        background: var(--fondo);
        color: var(--azul-oscuro);
        font-family: Arial, Helvetica, sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      .shell { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; }
      .site-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--borde);
        background: var(--blanco);
      }
      .site-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--azul-oscuro);
        font-weight: 900;
        letter-spacing: .4px;
      }
      .site-brand img { width: 118px; height: 44px; object-fit: contain; }
      .site-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
      .site-tabs a {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 15px;
        border-radius: 999px;
        color: var(--azul-oscuro);
        font-size: 14px;
        font-weight: 900;
      }
      .site-tabs a.activo { background: var(--azul-oscuro); color: var(--blanco); }
      .frame-header {
        padding: 22px 0 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .frame-header h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      .frame-header p { margin: 0.2rem 0 0; color: var(--texto); }
      .button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: var(--dorado);
        color: var(--azul-oscuro);
        font-weight: 900;
        white-space: nowrap;
      }
      .crece-frame {
        width: 100%;
        height: calc(100vh - 154px);
        min-height: 720px;
        border: 1px solid var(--borde);
        border-radius: 12px;
        background: var(--blanco);
      }
      @media (max-width: 760px) {
        .shell { width: 100%; }
        .site-nav,
        .frame-header {
          align-items: stretch;
          flex-direction: column;
          padding-left: 1rem;
          padding-right: 1rem;
        }
        .site-tabs { width: 100%; display: grid; grid-template-columns: 1fr; }
        .site-tabs a { border: 1px solid var(--borde); }
        .button { width: 100%; }
        .crece-frame { height: 78vh; min-height: 620px; border-radius: 0; border-left: 0; border-right: 0; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="site-nav" aria-label="Navegación principal">
        <a class="site-brand" href="./index.html">
          <img src="./prfwb-logo-cropped-v2.png" alt="PRFWB" />
          <span>PRFWB</span>
        </a>
        <div class="site-tabs">
          <a href="./index.html?v=menu1">Home</a>
          <a href="./who-we-are.html?v=menu1">Who We Are</a>
          <a href="./recursos.html?v=menu1">Recursos</a>
          <a href="./oracion.html?v=menu1">Oración</a>
          <a class="activo" href="./crece.html?v=menu1">CRECE</a>
        </div>
      </nav>

      <header class="frame-header">
        <div>
          <h1>Ministerio CRECE</h1>
          <p>Proyecto de educación cristiana de PRFWB.</p>
        </div>
        <a class="button" href="https://creceprfwb.github.io/ministerio-crece-prfwb/" target="_blank" rel="noopener">
          Abrir CRECE aparte
        </a>
      </header>

      <iframe
        class="crece-frame"
        title="Ministerio CRECE"
        src="https://creceprfwb.github.io/ministerio-crece-prfwb/"
      ></iframe>
    </div>
  </body>
</html>
