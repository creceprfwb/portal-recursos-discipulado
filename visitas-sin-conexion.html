<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12384d">
  <meta name="robots" content="noindex">
  <title>Sin conexión · Visitas</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:#f4f8fa; color:#12384d; font:16px/1.6 Arial,sans-serif; }
    main { max-width:400px; padding:28px; border:1px solid #dbe7ec; border-radius:20px; background:white; }
    h1 { line-height:1.2; font-size:26px; }
    p { color:#526875; }
    button { width:100%; min-height:48px; padding:12px; border:0; border-radius:10px; background:#12384d; color:white; font:inherit; font-weight:bold; cursor:pointer; }
    button:focus-visible { outline:3px solid #f1c84b; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <h1>Conéctate para continuar</h1>
    <p>Bienvenida y Visitas necesitan internet para enviar registros y consultar la información del equipo.</p>
    <p>Revisa tu Wi-Fi o tus datos móviles y vuelve a intentarlo.</p>
    <button type="button" onclick="location.reload()">Volver a intentar</button>
  </main>
</body>
</html>
