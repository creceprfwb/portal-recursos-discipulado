<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo | En la Palabra PRFWB</title>
  <meta name="description" content="Archivo de lecturas bíblicas PRFWB por año, mes, semana y día.">
  <script>
    let embedded = false;
    try { embedded = window.self !== window.top; } catch (error) { embedded = true; }
    if (embedded || new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed-mode');
  </script>
  <link rel="stylesheet" href="./en-la-palabra.css?v=14">
</head>
<body>
  <main class="page">
    <nav class="site-nav" aria-label="Navegación principal">
      <a class="nav-logo" href="./index.html"><img src="./prfwb-logo-main-cropped.png" alt="PRFWB"></a>
      <div class="nav-links">
        <a href="./recursos.html">Recursos</a>
        <a class="active" href="./en-la-palabra.html">En la Palabra</a>
      </div>
    </nav>
    <header class="hero">
      <div class="hero-inner">
        <div>
          <span class="eyebrow">Archivo</span>
          <h1>Lecturas anteriores</h1>
          <p>Explora por año, mes, semana y día. La arquitectura queda lista para añadir años futuros.</p>
        </div>
        <div class="hero-card"><span>Contenido disponible</span><strong id="archiveCount">0 lecturas</strong></div>
      </div>
    </header>
    <section class="shell">
      <div class="toolbar">
        <label style="flex:1">Buscar en archivo
          <input id="archiveSearch" placeholder="Referencia, libro, tema, titulo...">
        </label>
        <a class="button secondary" href="./en-la-palabra.html">Volver a lectura de hoy</a>
      </div>
      <div class="archive-grid" id="archiveGrid"></div>
      <div class="card" style="margin-top:1rem">
        <h2>Resultados</h2>
        <div class="week-list" id="archiveResults"></div>
      </div>
    </section>
  </main>
  <script src="./en-la-palabra-data.js?v=14"></script>
  <script>
    const data = window.enLaPalabraData;
    const readings = data.readings;
    document.getElementById('archiveCount').textContent = `${readings.length} lecturas`;
    function normalizeText(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }
    function formatDate(key) { return new Date(`${key}T00:00:00`).toLocaleDateString('es-PR', { weekday:'short', day:'numeric', month:'short' }); }
    function renderArchive() {
      document.getElementById('archiveGrid').innerHTML = data.months.map((month) => `
        <article class="card">
          <span class="pill">${month.year}</span>
          <h2>${month.monthName}: ${month.theme}</h2>
          <p class="muted">${month.description}</p>
          <div class="week-list">
            ${month.weeks.map((week) => `
              <div class="day-row">
                <strong>${week.title}</strong>
                <span>${week.start} al ${week.end}<br><strong>Domingo:</strong> ${week.sunday.reference}</span>
              </div>
            `).join('')}
          </div>
        </article>
      `).join('');
    }
    function renderResults() {
      const query = normalizeText(document.getElementById('archiveSearch').value.trim());
      const results = (query ? readings.filter((reading) => normalizeText([reading.reference, reading.title, reading.monthTheme, reading.weekTheme, ...(reading.keywords || [])].join(' ')).includes(query)) : readings).slice(0, 60);
      document.getElementById('archiveResults').innerHTML = results.map((reading) => `
        <a class="day-row" href="./en-la-palabra.html?fecha=${reading.date}${document.documentElement.classList.contains('embed-mode') ? '&embed=1' : ''}">
          <strong>${formatDate(reading.date)}</strong>
          <span><strong>${reading.reference}</strong><br>${reading.title}<br><span class="muted">${reading.weekTheme}</span></span>
        </a>
      `).join('');
    }
    document.getElementById('archiveSearch').addEventListener('input', renderResults);
    renderArchive();
    renderResults();
  </script>
</body>
</html>
