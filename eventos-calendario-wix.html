<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendario Jesús es el Centro</title>
    <style>
      :root {
        --ink: #0b2530;
        --deep: #12384d;
        --gold: #c7912b;
        --coral: #d95643;
        --soft: #f4f8fa;
        --white: #ffffff;
        --muted: #60717b;
        --line: rgba(18, 56, 77, .14);
        --shadow: 0 22px 60px rgba(11, 37, 48, .14);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        margin: 0;
        overflow-x: hidden;
        background: var(--soft);
        color: var(--ink);
        line-height: 1.55;
      }
      button, input { font: inherit; }
      a { color: inherit; text-decoration: none; }
      .calendar-wrap {
        width: 100%;
        min-height: 100vh;
        padding: 28px max(12px, calc((100vw - 1040px) / 2)) 36px;
        background:
          radial-gradient(circle at 14% 10%, rgba(199, 145, 43, .16), transparent 28%),
          radial-gradient(circle at 90% 12%, rgba(15, 97, 112, .13), transparent 30%),
          linear-gradient(180deg, #fff 0%, var(--soft) 100%);
      }
      .calendar-shell { width: 100%; max-width: 1040px; margin: 0 auto; }
      .calendar-head {
        display: grid;
        gap: 12px;
        margin: 0 0 18px;
        text-align: center;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--coral);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 2.2px;
        text-transform: uppercase;
      }
      .eyebrow-logo { display:block; height:64px; width:auto; margin:0 auto; }
      .eyebrow::before, .eyebrow::after {
        content: "";
        width: 24px;
        height: 2px;
        border-radius: 20px;
        background: var(--gold);
      }
      h1 {
        margin: 0;
        color: var(--deep);
        font-size: clamp(32px, 5vw, 54px);
        line-height: 1.04;
      }
      p { margin: 0; color: var(--muted); font-size: 16px; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 18px 0;
      }
      .btn {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border: 1px solid rgba(18, 56, 77, .18);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 900;
      }
      .btn.primary { background: #f1c84b; color: var(--deep); box-shadow: 0 14px 28px rgba(199, 145, 43, .24); }
      .btn.ghost { background: var(--white); color: var(--deep); }
      .calendar-card {
        overflow: hidden;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--white);
        box-shadow: var(--shadow);
      }
      .section-title {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .month-nav { display: flex; align-items: center; gap: 8px; }
      .month-title { min-width: 170px; text-align: center; font-weight: 900; color: var(--deep); }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }
      .day-name {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-align: center;
        text-transform: uppercase;
      }
      .day-name-short { display: none; }
      .day {
        min-height: 96px;
        min-width: 0;
        overflow: hidden;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfdfe;
        display: grid;
        align-content: start;
        gap: 7px;
      }
      .day.empty { background: transparent; border-color: transparent; }
      .day.has-events { background: #fff8db; }
      .day-number { font-weight: 900; color: var(--deep); }
      .pill {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        min-width: 0;
        padding: 3px 8px;
        border-radius: 999px;
        background: #eef7f9;
        color: var(--deep);
        font-size: 11px;
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .upcoming { margin-top: 22px; }
      .upcoming h2 { margin: 0 0 12px; color: var(--deep); font-size: 20px; }
      .event-list { display: grid; gap: 10px; }
      .row {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfdfe;
      }
      .row-title { font-weight: 900; color: var(--deep); }
      .row-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
      .page-footer { margin-top: 24px; text-align: center; }
      .page-footer a { color: var(--muted); font-size: 12px; font-weight: 700; text-decoration: underline; }
      @media (max-width: 640px) {
        .calendar-wrap { padding: 22px 10px 28px; }
        .calendar-card { padding: 12px; border-radius: 18px; }
        .calendar { gap: 3px; }
        .day { min-height: 52px; padding: 3px; border-radius: 6px; gap: 3px; }
        .day-number { font-size: 11px; }
        .day-name-full { display: none; }
        .day-name-short { display: block; }
        .calendar .day .pill {
          width: 6px;
          height: 6px;
          min-width: 0;
          max-width: none;
          padding: 0;
          border-radius: 50%;
          font-size: 0;
          line-height: 0;
          overflow: hidden;
        }
        .btn { width: 100%; }
        .actions { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="calendar-wrap">
      <div class="calendar-shell">
        <header class="calendar-head">
          <img class="eyebrow-logo" src="./jeec-logo.png" alt="Jesús es el Centro">
          <h1>Calendario de actividades</h1>
          <p>Consulta las próximas actividades de Jesús es el Centro.</p>
        </header>
        <div class="actions">
          <a class="btn primary" href="https://www.prfwb.com/" target="_top">Volver al inicio</a>
        </div>
        <section class="calendar-card" aria-label="Calendario Jesús es el Centro">
          <div class="section-title">
            <div class="month-title" id="monthTitle"></div>
            <div class="month-nav">
              <button class="btn ghost" type="button" id="prevMonth">Anterior</button>
              <button class="btn ghost" type="button" id="nextMonth">Siguiente</button>
            </div>
          </div>
          <div class="calendar" id="calendar"></div>
          <div class="upcoming">
            <h2>Próximas actividades especiales</h2>
            <div class="event-list" id="upcomingList"></div>
          </div>
          <div class="upcoming">
            <h2>Actividades recurrentes</h2>
            <div class="event-list" id="upcomingRecurringList"></div>
          </div>
        </section>
        <footer class="page-footer">
          <a href="./admin-eventos-wix.html">Admin</a>
        </footer>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./firebase-bridge.js"></script>
    <script>
      const state = {
        monthCursor: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
        events: []
      };

      const els = {
        calendar: document.getElementById('calendar'),
        monthTitle: document.getElementById('monthTitle'),
        upcomingList: document.getElementById('upcomingList'),
        upcomingRecurringList: document.getElementById('upcomingRecurringList')
      };

      function toDateInput(date) {
        const d = new Date(date);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 10);
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#039;'
        }[char]));
      }

      function formatDate(dateKey) {
        return new Date(`${dateKey}T00:00:00`).toLocaleDateString('es-PR', {
          weekday:'short',
          day:'numeric',
          month:'short'
        });
      }

      async function loadData() {
        state.events = await window.discipladoFirebase?.getCalendarEvents?.() || [];
        render();
      }

      function render() {
        renderCalendar();
        renderUpcoming();
      }

      function renderCalendar() {
        const year = state.monthCursor.getFullYear();
        const month = state.monthCursor.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startOffset = firstDay.getDay();
        const names = ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'];
        els.monthTitle.textContent = firstDay.toLocaleDateString('es-PR', { month:'long', year:'numeric' });
        let html = names.map((name) => `<div class="day-name"><span class="day-name-full">${name}</span><span class="day-name-short">${name[0]}</span></div>`).join('');
        for (let i = 0; i < startOffset; i += 1) html += '<div class="day empty"></div>';
        for (let day = 1; day <= lastDay.getDate(); day += 1) {
          const dateKey = toDateInput(new Date(year, month, day));
          const items = state.events.filter((item) => item.date === dateKey);
          html += `
            <div class="day${items.length ? ' has-events' : ''}">
              <span class="day-number">${day}</span>
              ${items.slice(0, 3).map((item) => `<span class="pill" style="background:${item.isRecurring ? '#94a3b8' : (item.color || '#078ca3')};color:#fff">${escapeHtml(item.title)}</span>`).join('')}
              ${items.length > 3 ? `<span class="pill">+${items.length - 3}</span>` : ''}
            </div>
          `;
        }
        els.calendar.innerHTML = html;
      }

      function eventRow(item) {
        return `
          <article class="row">
            <span class="pill" style="background:${item.isRecurring ? '#94a3b8' : (item.color || '#078ca3')};color:#fff">${escapeHtml(item.category || 'General')}</span>
            <div class="row-title">${escapeHtml(item.title)}</div>
            <div class="row-meta">${formatDate(item.date)}${item.start ? ` · ${escapeHtml(item.start)}${item.end ? '-' + escapeHtml(item.end) : ''}` : ''} · ${escapeHtml(item.location || 'Jesus es el Centro')}</div>
            ${item.link ? `<div class="row-meta"><a href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.link)}</a></div>` : ''}
          </article>
        `;
      }

      function renderUpcoming() {
        const today = toDateInput(new Date());
        const upcoming = state.events
          .filter((item) => item.date >= today)
          .sort((a, b) => `${a.date} ${a.start || ''}`.localeCompare(`${b.date} ${b.start || ''}`));

        const special = upcoming.filter((item) => !item.isRecurring).slice(0, 10);
        els.upcomingList.innerHTML = special.map(eventRow).join('') || '<div class="row-meta">No hay actividades especiales próximas registradas.</div>';

        const recurring = upcoming.filter((item) => item.isRecurring);
        const nextByTitle = new Map();
        recurring.forEach((item) => {
          if (!nextByTitle.has(item.title)) nextByTitle.set(item.title, item);
        });
        els.upcomingRecurringList.innerHTML = [...nextByTitle.values()].map(eventRow).join('') || '<div class="row-meta">No hay actividades recurrentes registradas.</div>';
      }

      document.getElementById('prevMonth').addEventListener('click', () => {
        state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() - 1, 1);
        render();
      });

      document.getElementById('nextMonth').addEventListener('click', () => {
        state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() + 1, 1);
        render();
      });

      loadData();
    </script>
  </body>
</html>
